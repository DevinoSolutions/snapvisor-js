name: Deprecate broken versions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deprecate:
    runs-on: ubuntu-latest

    steps:
      - name: Deprecate empty-tarball versions
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          npm deprecate @snapvisor/cypress@7.0.22 "broken publish (no dist); use 7.0.23+"
          npm deprecate @snapvisor/puppeteer@6.0.23 "broken publish (no dist); use 6.0.24+"
          npm deprecate @snapvisor/webdriverio@0.7.19 "broken publish (no dist); use 0.7.20+"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
